rvm: true
builds:
  build_1:
    paths:
      - "**/*"
      - "!README.rdoc"
      - "!LICENSE.txt"
      - "!.document"
      - "!.gitignore"
      - "!docs/**"
    environment:
      RUBY_VERSION: 2.6.8
    name: Ruby 2.6.8
    script:
      - bundle exec rspec
  build_2:
    paths:
      - "**/*"
      - "!README.rdoc"
      - "!LICENSE.txt"
      - "!.document"
      - "!.gitignore"
      - "!docs/**"
    environment:
      RUBY_VERSION: 2.7.6
    name: Ruby 2.7.6
    script:
      - bundle exec rspec
  build_3:
    paths:
      - "**/*"
      - "!README.rdoc"
      - "!LICENSE.txt"
      - "!.document"
      - "!.gitignore"
      - "!docs/**"
    environment:
      RUBY_VERSION: 3.0.3
    name: Ruby 3.0.3
    script:
      - bundle exec rspec
  build_4:
    paths:
      - "**/*"
      - "!README.rdoc"
      - "!LICENSE.txt"
      - "!.document"
      - "!.gitignore"
      - "!docs/**"
    environment:
      RUBY_VERSION: 3.1.2
    name: Ruby 3.1.2
    script:
      - bundle exec rspec
  build_5:
    paths:
      - "**/*"
      - "!README.rdoc"
      - "!LICENSE.txt"
      - "!.document"
      - "!.gitignore"
      - "!docs/**"
    name: Linters
    script:
      - bundle exec rubocop
